name: iPadOS build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  native-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: mupdf
        with:
          path: Vendor/mupdf
          key: mupdf-linux-1.28.6-nojs-${{ runner.arch }}-v1
      - name: Fetch pinned MuPDF sources
        run: bash scripts/ci-prepare-mupdf.sh
      - name: Build native engine and tools
        run: make -C Vendor/mupdf -j3 build=release HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no USE_SYSTEM_CURL=no USE_TESSERACT=no USE_ZXINGCPP=no mujs=no tools
      - name: Test production C bridge
        run: python3 scripts/test-native-engine.py --source Vendor/mupdf
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.mupdf.outputs.cache-hit != 'true' }}
        with:
          path: Vendor/mupdf
          key: mupdf-linux-1.28.6-nojs-${{ runner.arch }}-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-engine-results
          path: build/native-engine-tests/report.json
  test:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Identify Apple toolchain
        id: toolchain
        run: echo "signature=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: mupdf
        with:
          path: |
            Vendor/mupdf
            build/mupdf
          key: mupdf-ios-1.28.6-${{ runner.arch }}-${{ steps.toolchain.outputs.signature }}-${{ hashFiles('scripts/build-mupdf-xcode.sh', 'Native/AppleCompat/**') }}-v3
      - name: Fetch pinned MuPDF sources and notices
        run: bash scripts/ci-prepare-mupdf.sh
      - name: Check project and localization resources
        run: |
          python3 scripts/check-project.py
          python3 scripts/check-localization.py
      - name: Build and run PDF workflow tests
        run: |
          mkdir -p build
          set +e
          bash scripts/test-ios.sh > build/xcodebuild.log 2>&1
          build_status=$?
          set -e
          CI_BUILD_STATUS="$build_status" python3 scripts/ci-build-summary.py
          exit "$build_status"
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.mupdf.outputs.cache-hit != 'true' }}
        with:
          path: |
            Vendor/mupdf
            build/mupdf
          key: mupdf-ios-1.28.6-${{ runner.arch }}-${{ steps.toolchain.outputs.signature }}-${{ hashFiles('scripts/build-mupdf-xcode.sh', 'Native/AppleCompat/**') }}-v3
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipados-test-results
          path: |
            build/*.xcresult
            build/xcodebuild.log
          if-no-files-found: ignore
